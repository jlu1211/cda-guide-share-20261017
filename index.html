    [hidden] { display: none !important; }
    .gate { display: grid; min-height: 100dvh; place-items: center; padding: 28px 20px; }

    button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; }
    #unlock { width: 100%; min-height: 48px; margin-top: 16px; background: #146c98; color: white; font-size: 14px; font-weight: 700; }

    button:focus-visible { outline: 3px solid #93c5e0; outline-offset: 3px; }

    .note { margin: 12px 0 0; padding-top: 18px; border-top: 1px solid #e4ebf0; color: #647986; font-size: 11px; line-height: 1.8; }

    #lock { position: fixed; right: 14px; bottom: 14px; z-index: 100; padding: 9px 16px; border: 1px solid #bacbd5; background: #ffffffed; color: #153247; box-shadow: 0 2px 14px #1532471a; font-size: 12px; }
    @media (max-width: 480px) { .card { padding: 28px 22px; } h1 { font-size: 24px; } }
    @media print { #lock { display: none; } }

    (() => {
      'use strict';
      const payload = JSON.parse(document.getElementById('encrypted-payload').textContent);
      const aad = 'secure-report:v1';
      const form = document.getElementById('unlock-form');
      const input = document.getElementById('password');
      const submit = document.getElementById('unlock');
      const status = document.getElementById('status');
      const gate = document.getElementById('gate');
      const viewer = document.getElementById('viewer');
      const lock = document.getElementById('lock');
      const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (submit.disabled) return;
        if (!crypto.subtle) {
          status.textContent = 'このブラウザでは復号できません。最新のブラウザでHTTPSのURLを開いてください。';
          return;
        }
        submit.disabled = true;
        submit.textContent = '資料を開いています…';
        status.textContent = '';
        try {
          const password = input.value.trim();
          input.value = '';
          const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
          const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
          const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv), additionalData: new TextEncoder().encode(aad), tagLength: 128 }, key, bytes(payload.data));
          const html = new TextDecoder('utf-8', { fatal: true }).decode(plain);
          viewer.srcdoc = html;
          viewer.hidden = false;
          gate.hidden = true;
          lock.hidden = false;
          document.title = '共有資料 | 閲覧中';
          viewer.focus();
        } catch (error) {
          status.textContent = '資料を開けませんでした。パスワードをご確認ください。';
          input.focus();
        } finally {
          input.value = '';
          submit.disabled = false;
          submit.textContent = '資料を開く';
        }
      });
      lock.addEventListener('click', () => location.reload());
    })();
  </script>
